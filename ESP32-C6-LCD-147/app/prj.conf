# Console & Serial configuration
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y

# Enable floating point format support in printf / snprintf
CONFIG_CBPRINTF_FP_SUPPORT=y

# Networking & Wi-Fi
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=y

# BSD / POSIX Sockets for HTTP & SSE Server
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONN=8
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# DNS & NTP / SNTP Time Client
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y

# SD Card (SPI SDHC) & FatFS File System
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_MAX_SS=512
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_NUM_FILES=6
CONFIG_FS_FATFS_NUM_DIRS=3

# Hardware Peripherals: PWM, Counter, I2C, INA219
CONFIG_PWM=y
CONFIG_COUNTER=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_INA219=y

# Display & SPI for 1.47" ST7789 LCD (172x320)
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y

# Memory Management & Stacks
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_TX_STACK_SIZE=3072
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=4096
