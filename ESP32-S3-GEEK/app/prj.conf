# USB CDC ACM Console configuration for ESP32-S3 USB-JTAG/Serial
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y

# IPM inter-core messaging
CONFIG_IPM=y

# Enable floating point format support in printf / snprintf
CONFIG_CBPRINTF_FP_SUPPORT=y

# Networking & Wi-Fi
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_NTP_SERVER=n
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_STA_AUTO_DHCPV4=n
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# BSD / POSIX Sockets for HTTP Server
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONN=8
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# DNS & NTP / SNTP Time Client
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y

# SD Card & FatFS File System
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_MAX_SS=512
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_NUM_FILES=6
CONFIG_FS_FATFS_NUM_DIRS=3

# Memory Management & Stacks
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=3072

# Sampling & Acquisition
CONFIG_APP_SAMPLE_RATE_HZ=10
