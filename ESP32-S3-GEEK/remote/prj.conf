# Peripheral Drivers for Core 1 (APP_CPU) Real-Time Engine
CONFIG_GPIO=y
CONFIG_COUNTER=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_INA219=y

# IPM inter-core mailbox
CONFIG_IPM=y

# Display & SPI for 1.14" ST7789 LCD
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y

# Memory Management & Formatting
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=y
