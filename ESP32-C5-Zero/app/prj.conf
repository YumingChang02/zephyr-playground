# USB CDC / Serial Console configuration for ESP32-C5 USB-JTAG/Serial
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y

# Enable Zephyr Counter driver (hardware timer via devicetree)
CONFIG_COUNTER=y

# Enable floating point format support in printf / snprintf
CONFIG_CBPRINTF_FP_SUPPORT=y

# Networking & Wi-Fi
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_ACCEPT_UNICAST=n
CONFIG_NET_DHCPV4_OPTION_NTP_SERVER=n
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y

# BSD / POSIX Sockets for HTTP Server
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONN=12
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# Memory Management & Stacks
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

